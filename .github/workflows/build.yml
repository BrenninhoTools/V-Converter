name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "server/**"
      - "docs/**"
      - ".github/workflows/server.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "server/**"
      - "docs/**"
      - ".github/workflows/server.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_kotlin.incremental: "false"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 300M

jobs:
  android:
    name: V Converter-Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache native objects
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-android-${{ hashFiles('source/native/**') }}
          restore-keys: ccache-android-
          max-size: 300M

      - name: Install the Android SDK platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
          fi

      - name: Build release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew :app:assembleRelease -Pvconverter.modules=app -Pvconverter.abis=arm64-v8a --build-cache

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/V Converter-Android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Android
          path: out/V Converter-Android.apk
          compression-level: 0

  windows:
    name: V Converter-Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache WiX
        uses: actions/cache@v4
        with:
          path: build/wixToolset
          key: wix-3.11.2

      - name: Build installer
        shell: bash
        run: ./gradlew :desktop:packageExe -Pvconverter.modules=desktop --build-cache

      - name: Name the installer
        shell: bash
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/exe/*.exe "out/V Converter-Windows.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Windows
          path: out/V Converter-Windows.exe
          compression-level: 0

  linux:
    name: V Converter-Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache native objects
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ hashFiles('source/native/**') }}
          restore-keys: ccache-linux-
          max-size: 300M

      - name: Test V-MiniAudio and V-Touch
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -S source/native/v-miniaudio -B build/v-miniaudio -DVMA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/v-miniaudio --parallel
          ctest --test-dir build/v-miniaudio --output-on-failure
          cmake -S source/native/v-touch -B build/v-touch -DVTOUCH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/v-touch --parallel
          ctest --test-dir build/v-touch --output-on-failure

      - name: Build package and portable app
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable -Pvconverter.modules=desktop --build-cache

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/deb/*.deb "out/V Converter-Linux.deb"
          tar -czf "out/V Converter-Linux.tar.gz" -C desktop/build/compose/binaries/main/app V-Converter

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Linux
          path: |
            out/V Converter-Linux.deb
            out/V Converter-Linux.tar.gz
          compression-level: 0

  macos:
    name: V Converter-MacOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache native objects
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-macos-${{ hashFiles('source/native/**') }}
          restore-keys: ccache-macos-
          max-size: 300M

      - name: Build disk image and app
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable -Pvconverter.modules=desktop --build-cache

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/V Converter-MacOS.dmg"
          ditto -c -k --keepParent desktop/build/compose/binaries/main/app/V-Converter.app "out/V Converter-MacOS.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-MacOS
          path: |
            out/V Converter-MacOS.dmg
            out/V Converter-MacOS.zip
          compression-level: 0

  ios:
    name: V Converter-IOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/caches
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ hashFiles('source/native/cinterop/**') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-
            konan-${{ runner.os }}-

      - name: Cache XcodeGen
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: ~/.xcodegen
          key: xcodegen-2.42.0

      - name: Build the Kotlin framework
        run: ./gradlew :ios:linkDebugFrameworkIosArm64 -Pvconverter.modules=ios --no-configuration-cache --build-cache "-Dorg.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"

      - name: Generate the Xcode project
        run: |
          if [ ! -x ~/.xcodegen/xcodegen/bin/xcodegen ]; then
            curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
            mkdir -p ~/.xcodegen && unzip -q "$RUNNER_TEMP/xcodegen.zip" -d ~/.xcodegen
          fi
          cd iosApp && ~/.xcodegen/xcodegen/bin/xcodegen generate --quiet

      - name: Build the app
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -quiet -project VConverter.xcodeproj -target VConverter -configuration Release -sdk iphoneos -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO SWIFT_COMPILATION_MODE=wholemodule build 2>&1 | tee xcodebuild.log \
            || { grep -E "error:|fatal error|Undefined symbol|ld:" xcodebuild.log | head -60; exit 1; }

      - name: Package the IPA
        run: |
          mkdir -p out/Payload
          cp -R "iosApp/build/Release-iphoneos/V-Converter.app" out/Payload/
          cd out && zip -qr "V Converter-IOS.ipa" Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-IOS
          path: out/V Converter-IOS.ipa
          compression-level: 0

  web:
    name: V Converter-Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: on-failure

      - name: Cache Node.js, Yarn, Binaryen and npm packages for Kotlin/Wasm
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/nodejs
            ~/.gradle/yarn
            ~/.gradle/binaryen
            ~/.cache/yarn
            build/js/node_modules
            kotlin-js-store
          key: kotlin-web-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'web/build.gradle.kts') }}
          restore-keys: kotlin-web-${{ runner.os }}-

      - name: Build the web app
        run: ./gradlew :web:wasmJsBrowserDistribution -Pvconverter.modules=web --no-configuration-cache --build-cache

      - name: Collect the site
        run: |
          mkdir -p out
          cp -R web/build/dist/wasmJs/productionExecutable out/site

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Web
          path: out/site

      - name: Upload for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  pages:
    name: Publish the web app
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
