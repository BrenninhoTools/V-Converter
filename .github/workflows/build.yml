name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: V Converter-Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/V Converter-Android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Android
          path: out/V Converter-Android.apk
          compression-level: 0

  windows:
    name: V Converter-Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build installer
        shell: bash
        run: ./gradlew :desktop:packageExe

      - name: Name the installer
        shell: bash
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/exe/*.exe "out/V Converter-Windows.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Windows
          path: out/V Converter-Windows.exe
          compression-level: 0

  linux:
    name: V Converter-Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build package and portable app
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/deb/*.deb "out/V Converter-Linux.deb"
          tar -czf "out/V Converter-Linux.tar.gz" -C desktop/build/compose/binaries/main/app V-Converter

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-Linux
          path: |
            out/V Converter-Linux.deb
            out/V Converter-Linux.tar.gz
          compression-level: 0

  macos:
    name: V Converter-MacOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build disk image and app
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable

      - name: Name the builds
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/dmg/*.dmg "out/V Converter-MacOS.dmg"
          ditto -c -k --keepParent desktop/build/compose/binaries/main/app/V-Converter.app "out/V Converter-MacOS.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: V Converter-MacOS
          path: |
            out/V Converter-MacOS.dmg
            out/V Converter-MacOS.zip
          compression-level: 0
